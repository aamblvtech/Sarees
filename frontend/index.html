<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VESTRA — Experience Fashion Before You Wear It | AI Virtual Try-On</title>
    <meta name="description" content="VESTRA — Luxury fashion technology platform with AI virtual draping. Try before you buy with architectural tailoring, fluid silks, and bespoke fitting." />
    
    <!-- Instant Theme Bootstrap (Forces Soft Rose Light Mode by default) -->
    <script>
      (function() {
        try {
          var v = localStorage.getItem('vestra_rose_palette_v1');
          if (!v) {
            localStorage.setItem('vestra_rose_palette_v1', 'true');
            localStorage.setItem('vestra_theme', 'light');
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
            return;
          }
          var t = localStorage.getItem('vestra_theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
